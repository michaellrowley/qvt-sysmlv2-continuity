[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml-v2-qvt-continuity"
version = "0.1.0"
description = "Executable continuity contracts and lifecycle operations for SysML v2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
sysml-qvt-continuity = "sysml_v2_qvt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
